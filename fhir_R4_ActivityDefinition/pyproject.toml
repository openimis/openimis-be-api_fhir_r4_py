[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openimis-be-fhir-r4-activity-definition"
version = "1.0.0"
requires-python = ">=3.8"
description = "OpenIMIS FHIR R4 ActivityDefinition module"
license = "AGPL-3.0-or-later"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "OpenIMIS Initiative", email = "admin@openimis.org"}
]
dependencies = [
    "django>=3.2,<5.0",
    "djangorestframework>=3.12.0",
    "fhir.resources>=6.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Homepage = "https://github.com/openimis/openimis-be-api_fhir_r4_py"

[tool.setuptools]
py-modules = ["apps", "urls"]
packages = ["configurations", "converters", "mapping", "serializers", "views"]
include-package-data = true
