[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openimis-be-fhir_r4_subscription"
version = "1.4.0"
requires-python = ">=3.8"
description = "The openIMIS Backend FHIR R4 Subscription module."
readme = {file = "README.md", content-type = "text/markdown"}
license = "AGPL-3.0-or-later"
authors = [
    {name = "Faris Ahmetasevic", email = "faris.ahmetasevic@hotmail.com"}
]
dependencies = [
    "django",
    "djangorestframework",
    "openimis-be-core",
    "openimis-be-api_fhir_r4",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 2.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]

[project.urls]
Homepage = "https://openimis.org/"

[tool.setuptools]
py-modules = ["admin", "apps", "models", "urls"]
packages = ["configurations", "converters", "mapping", "migrations", "permissions", "serializers", "services", "validation", "views"]
include-package-data = true
